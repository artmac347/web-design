<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef0f5;
      --ink: #161b3a;
      --muted: #5b6285;
      --card: #ffffff;
      --accent: #2f3a78;
      --accent-hover: #232c5e;
      --line: #d9dcea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 1px solid var(--line);
      background: var(--card);
    }
    .logo {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: .02em;
      color: var(--ink);
      text-decoration: none;
    }
    .actions { display: flex; align-items: center; gap: 16px; font-size: .95rem; }
    .actions a { color: var(--muted); text-decoration: none; }
    .actions a:hover { color: var(--ink); }
    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 18px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    main { max-width: 960px; margin: 0 auto; padding: 48px 20px; }
    h1 {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 7vw, 4rem);
      line-height: 1;
      margin: 0 0 10px;
    }
    .sub { color: var(--muted); margin: 0 0 36px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
    }
    .card h2 { margin: 0 0 6px; font-size: 1rem; }
    .card p { margin: 0; color: var(--muted); font-size: .95rem; word-break: break-word; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">CLIFFORD</a>
    <div class="actions">
      <a href="/">Back to site</a>
      <button id="logout" type="button">Logout</button>
    </div>
  </header>

  <main>
    <h1 id="hello">Welcome!</h1>
    <p class="sub">Naka-login ka na. Ito ang member area mo.</p>

    <div class="grid">
      <div class="card">
        <h2>Your account</h2>
        <p id="email">…</p>
      </div>
      <div class="card">
        <h2>Status</h2>
        <p>Naka-login ang session mo sa browser na ito.</p>
      </div>
      <div class="card">
        <h2>Next</h2>
        <p>Dito mo pwedeng ilagay ang laman ng app mo.</p>
      </div>
    </div>
  </main>

  <script>
    fetch("/api/me")
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((u) => {
        document.getElementById("hello").textContent = "Welcome, " + u.username + "!";
        document.getElementById("email").textContent = u.email;
      })
      .catch(() => (location.href = "/"));

    document.getElementById("logout").addEventListener("click", async () => {
      try { await fetch("/api/logout", { method: "POST" }); } catch {}
      location.href = "/";
    });
  </script>
</body>
</html>
