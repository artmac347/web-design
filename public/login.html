<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <h1>Welcome back</h1>
    <p class="sub">Mag-login para ituloy.</p>

    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <div class="error" id="error" role="alert"></div>
    <button type="submit" id="btn">Login</button>

    <div class="alt">Wala pang account? <a href="/register">Mag-register</a></div>
  </form>

  <script>
    const form = document.getElementById("form");
    const err = document.getElementById("error");
    const btn = document.getElementById("btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.textContent = "";
      btn.disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value,
          }),
        });
        const data = await res.json();
        if (res.ok) location.href = "/dashboard";
        else err.textContent = data.error || "May error.";
      } catch {
        err.textContent = "Hindi maabot ang server.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
